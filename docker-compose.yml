 
services:
  frontend:
    build: ./frontend
    container_name: cicd-frontend-container
    ports:
      - "8080:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: cicd-backend-container
    ports:
      - "5001:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
    volumes:
      - backend-data:/data

volumes:
  backend-data:

